[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqmonitor"
version = "0.1.0"
description = "Air quality and health monitor: live OpenAQ sensor data, a pollution map and 72-hour PM2.5 forecasts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "folium==0.20.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "prophet==1.5.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "streamlit==1.65.0",
    "streamlit-folium==0.27.4",
]

[project.optional-dependencies]
dev = [
    "black==26.10.0",
    "codespell==2.4.3",
    "flake8==7.4.1",
    "Flake8-pyproject==1.2.4",
    "isort==9.0.2",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "pytest==9.1.1",
]

[project.scripts]
format = "scripts.dev:format_code"
verify = "scripts.dev:verify"

[tool.setuptools]
packages = ["aqmonitor", "scripts"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
max-complexity = 10
extend-ignore = ["E203"]
exclude = [".venv", "build", "data", "models"]

[tool.codespell]
skip = ".venv,build,data,models,*.egg-info"
ignore-words-list = "shepard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
